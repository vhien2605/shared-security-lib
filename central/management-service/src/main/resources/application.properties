spring.application.name=management-service
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/security_library
spring.datasource.username=admin
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis123
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8000/realms/security-lib-realm
# Dev-only fallback: Base64 for 32 bytes. Override in real environments; rotating this value breaks existing HMAC ciphertext decryption.
security.credentials.master-secret=${SECURITY_CREDENTIALS_MASTER_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
#kafka
spring.kafka.bootstrap-servers=localhost:9094
#producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
#consumer
spring.kafka.consumer.group-id=management-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.admin.auto-create=true
#logging.level.org.apache.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO
# Bat/tat module phat hien bat thuong
anomaly.enabled=true
# Topic Kafka chua security log dau vao
anomaly.kafka.logs-topic=security.logs
# Topic Kafka chua anomaly event dau ra cho Logstash -> ES
anomaly.kafka.anomalies-topic=security.anomalies
# So ngay lookback xay dung baseline lich su (tinh median + IQR)
anomaly.baseline.lookback-days=14
# So log mau toi thieu de baseline lich su du tin cay
anomaly.baseline.min-log-samples=10
# So window toi thieu de behavior baseline du tin cay
anomaly.baseline.min-behavior-windows=3
# Gioi han so gia tri known luu trong baseline (clientId, sourceIp, errorCode)
anomaly.baseline.known-value-limit=200
# Kich thuoc rolling window cho behavior rules
anomaly.rolling.window-size=PT5M
# Khoang chap nhan event den muon van tinh vao window
anomaly.rolling.late-tolerance=PT1M
# So request toi thieu trong window de du mau
anomaly.rolling.min-samples=20
# Epsilon cong vao IQR khi tinh robust Z-score (tranh chia 0)
anomaly.robust-z.epsilon=1.0
# RiskScore >= threshold => severity MEDIUM
anomaly.risk.medium-severity-threshold=5
# RiskScore >= threshold => severity HIGH
anomaly.risk.high-severity-threshold=7
# RiskScore >= threshold => severity CRITICAL
anomaly.risk.critical-severity-threshold=8
# Bat/tat gop incident trung trong cua so dedup
anomaly.incident.enabled=true
# Cua so dedup: cac event cung incidentId duoc gop lam mot
anomaly.incident.dedup-window=PT5M
# So ngay luu incident trong ES
anomaly.incident.retention-days=30
# Bat/tat tu dong recompute baseline theo lich
anomaly.baseline.recompute.enabled=false
# Cron recompute baseline (mac dinh chu nhat 3h UTC)
anomaly.baseline.recompute.cron=0 0 3 ? * SUN
# Mui gio cho cron
anomaly.baseline.recompute.zone=UTC
