input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["security.anomalies"]
    group_id => "security-anomaly-logstash"
    codec => json
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_security_anomaly_date_parse_failure"]
    }
  }

  if [incidentId] and [incidentId] != "" {
    mutate {
      add_field => { "[@metadata][document_id]" => "%{[incidentId]}" }
    }
    if ![status] or [status] == "" {
      mutate {
        add_field => { "status" => "OPEN" }
      }
    }
  } else if [anomalyId] and [anomalyId] != "" {
    mutate {
      add_field => { "[@metadata][document_id]" => "%{[anomalyId]}" }
    }
  }
}

output {
  if [@metadata][document_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "security-anomalies-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "security-anomalies-%{+YYYY.MM.dd}"
    }
  }
}
