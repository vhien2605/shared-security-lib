services:
  kafka:
    container_name: kafka
    image: apache/kafka:4.1.1
    hostname: kafka
    restart: always
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - security-library
  kafka2:
    container_name: kafka2
    image: apache/kafka:4.1.1
    hostname: kafka2
    restart: always
    ports:
      - "9194:9194"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka2:9193
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9192,CONTROLLER://0.0.0.0:9193,EXTERNAL://0.0.0.0:9194
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9192,EXTERNAL://localhost:9194
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - security-library
  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: security_library
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    networks:
      - security-library
  redis:
    container_name: redis
    image: redis:8
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - security-library
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.2
    restart: always
    ports:
      - "8000:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: 123456
    volumes:
      - ./central/keycloak:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
    depends_on:
      - postgres
    networks:
      - security-library
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - ./central/elasticsearch/templates:/usr/share/elasticsearch/templates
      - ./central/elasticsearch/ilm:/usr/share/elasticsearch/ilm
    networks:
      - security-library
  elasticsearch-template-loader:
    container_name: elasticsearch-template-loader
    image: curlimages/curl:8.16.0
    depends_on:
      - elasticsearch
    environment:
      ANOMALY_RETENTION_DAYS: ${ANOMALY_RETENTION_DAYS:-30}
    volumes:
      - ./central/elasticsearch/templates:/templates:ro
      - ./central/elasticsearch/ilm:/ilm:ro
    command:
      - sh
      - -c
      - |
        until curl -fs -o /dev/null http://elasticsearch:9200/_cluster/health; do sleep 2; done
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_ilm/policy/security-log-r14-policy -H 'Content-Type: application/json' --data-binary @/ilm/security-log-r14-policy.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_ilm/policy/security-log-r30-policy -H 'Content-Type: application/json' --data-binary @/ilm/security-log-r30-policy.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_ilm/policy/security-log-r90-policy -H 'Content-Type: application/json' --data-binary @/ilm/security-log-r90-policy.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_ilm/policy/security-anomaly-policy -H 'Content-Type: application/json' --data '{"policy":{"phases":{"delete":{"min_age":"'$${ANOMALY_RETENTION_DAYS}'d","actions":{"delete":{}}}}}}'
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_component_template/security-log-mappings -H 'Content-Type: application/json' --data-binary @/templates/security-log-mappings-component-template.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_index_template/security-log-template -H 'Content-Type: application/json' --data-binary @/templates/security-log-template.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_index_template/security-log-r14-template -H 'Content-Type: application/json' --data-binary @/templates/security-log-r14-template.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_index_template/security-log-r30-template -H 'Content-Type: application/json' --data-binary @/templates/security-log-r30-template.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_index_template/security-log-r90-template -H 'Content-Type: application/json' --data-binary @/templates/security-log-r90-template.json
        curl -fsS -o /dev/null -X PUT http://elasticsearch:9200/_index_template/security-anomaly-template -H 'Content-Type: application/json' --data-binary @/templates/security-anomaly-template.json
    networks:
      - security-library
  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:9.2.8
    restart: always
    depends_on:
      - kafka
      - elasticsearch
    ports:
      - "9600:9600"
    volumes:
      - ./central/logstash/pipeline:/usr/share/logstash/pipeline
      - ./central/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml
    networks:
      - security-library
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.2.8
    restart: always
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    networks:
      - security-library
  kibana-setup:
    container_name: kibana-setup
    image: curlimages/curl:8.16.0
    depends_on:
      - kibana
    command:
      - sh
      - -c
      - |
        until curl -fs -o /dev/null http://kibana:5601/api/status; do sleep 2; done
        if curl -fs -o /dev/null -H 'kbn-xsrf: true' http://kibana:5601/api/data_views/data_view/security-logs; then exit 0; fi
        curl -fsS -X POST http://kibana:5601/api/data_views/data_view \
          -H 'kbn-xsrf: true' \
          -H 'Content-Type: application/json' \
          --data '{"data_view":{"id":"security-logs","name":"Security Logs","title":"security-logs-*","timeFieldName":"@timestamp","allowNoIndex":true}}'
    networks:
      - security-library
  central-backend:
    container_name: central-backend
    build:
      context: ./central/management-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
      - kafka
      - keycloak
      - elasticsearch
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/security_library
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8000/realms/security-lib-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/security-lib-realm/protocol/openid-connect/certs
      SECURITY_CREDENTIALS_MASTER_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    networks:
      - security-library
  central-frontend:
    container_name: central-frontend
    build:
      context: ./central/frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - central-backend
      - keycloak
      - kibana
    ports:
      - "5173:5173"
    environment:
      VITE_KIBANA_BASE_URL: http://localhost:5601
    networks:
      - security-library
networks:
  security-library:
    name: security-library
    driver: bridge
