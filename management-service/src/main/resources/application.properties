spring.application.name=management-secureService
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/security_library
spring.datasource.username=admin
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis123
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8000/realms/security-lib-realm
#kafka
spring.kafka.bootstrap-servers=localhost:9094
#producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
#consumer
spring.kafka.consumer.group-id=management-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.admin.auto-create=true
#logging.level.org.apache.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=DEBUG
# Security endpoint registration defaults
app.security.inbound.default.rate-limit=100
app.security.inbound.default.rate-limit-window-seconds=60
app.security.inbound.default.timeout-ms=30000
app.security.inbound.default.request-size-limit-kb=10240
app.security.inbound.default.response-size-limit-kb=10240
app.security.inbound.default.response-time-threshold-ms=5000
app.security.inbound.default.log-retention-days=30
app.security.outbound.default.timeout-ms=30000
app.security.outbound.default.response-time-threshold-ms=5000
app.security.outbound.default.retry-count=3
app.security.outbound.default.retry-backoff-ms=1000
app.security.outbound.default.log-retention-days=30
# Alert default configs
app.security.alert.default.severity=WARNING
app.security.alert.default.throttle-minutes=5
app.security.alert.default.channels=LOG