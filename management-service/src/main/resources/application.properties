spring.application.name=management-service
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/security_library
spring.datasource.username=admin
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=redis123
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8000/realms/security-lib-realm
#kafka
spring.kafka.bootstrap-servers=localhost:9094
#producer
#spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
#consumer
spring.kafka.consumer.group-id=management-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.admin.auto-create=true
#logging.level.org.apache.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO